aid: windsurfrules
name: Windsurf
description: >-
  Windsurf (formerly Codeium) is an AI-native code editor featuring Cascade, an autonomous AI agent that can plan
  multi-step code changes, execute terminal commands, read linter output, and modify files across entire projects. The
  .windsurfrules file format provides project-specific configuration for the Cascade AI assistant, defining coding
  conventions, standards, and behavioral instructions. Windsurf offers an Enterprise API for querying code completion
  analytics, Cascade AI usage, billing configuration, and team management.
