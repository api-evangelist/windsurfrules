vocabulary:
  name: Windsurf Vocabulary
  description: >-
    Domain vocabulary for Windsurf (Codeium's AI-native code editor) covering the
    .windsurfrules configuration format, Cascade AI agent capabilities, Enterprise
    API concepts, analytics terminology, and developer workflow patterns.
  version: '1.0'
  created: '2026-05-03'
  modified: '2026-05-03'
  tags:
    - AI Agents
    - AI Copilot
    - Coding Standards
    - Developer Workflow
    - IDE
    - Windsurf

terms:
  - term: .windsurfrules
    definition: >-
      A plain-text configuration file placed in the root of a project that
      provides persistent instructions to the Cascade AI assistant. Rules
      define coding conventions, project context, naming standards, and
      behavioral guidelines that Cascade applies across all interactions
      within the project.
    category: Configuration
    tags:
      - Configuration
      - Rules
      - Cascade

  - term: Cascade
    definition: >-
      Windsurf's autonomous AI agent built into the IDE. Cascade can plan and
      execute multi-step code changes, run terminal commands, analyze linter
      output, read error messages, and modify files across an entire codebase.
      It is the primary AI assistant that reads .windsurfrules for context.
    category: AI Agent
    tags:
      - AI Agents
      - Cascade
      - Automation

  - term: Activation Mode
    definition: >-
      The trigger mechanism for .windsurfrules files. Modes include "always"
      (applied to all interactions), "manual" (enabled on demand), and "glob"
      (activated when files matching a pattern are in context).
    category: Configuration
    tags:
      - Configuration
      - Rules

  - term: Service Key
    definition: >-
      An enterprise authentication credential used in the Windsurf API.
      Service keys are included in the JSON request body (not headers) and
      have specific permissions assigned (Analytics Read, Teams Read-Only,
      Billing Read, Billing Write).
    category: API
    tags:
      - Authentication
      - Enterprise
      - API

  - term: Codeium
    definition: >-
      The parent company behind Windsurf, providing AI coding assistance
      tools including the Windsurf IDE, VS Code extension, and enterprise
      platform. The Enterprise API server is hosted at server.codeium.com.
    category: Company
    tags:
      - Codeium
      - Company

  - term: SuperComplete
    definition: >-
      An advanced code completion feature in Windsurf that analyzes libraries,
      dependencies, and API schemas to predict entire code blocks, not just
      single lines. Goes beyond traditional autocomplete.
    category: Feature
    tags:
      - Autocomplete
      - Feature

  - term: Cascade Lines
    definition: >-
      A metric in the Windsurf Enterprise API measuring the number of lines
      of code generated by the Cascade AI agent. Available through the
      CascadeAnalytics endpoint as a query parameter.
    category: Analytics
    tags:
      - Analytics
      - Metrics
      - Cascade

  - term: Analytics Data Source
    definition: >-
      The data category for custom analytics queries in the Windsurf Enterprise
      API. Available sources are USER_DATA (code completions), CHAT_DATA (chat
      interactions), COMMAND_DATA (command executions), and PCW_DATA (project
      context window usage).
    category: Analytics
    tags:
      - Analytics
      - API

  - term: Acceptance Rate
    definition: >-
      A metric measuring the percentage of AI code completion suggestions that
      developers accept and incorporate into their code. A key KPI for measuring
      the effectiveness of AI coding assistance. Available in user-level analytics.
    category: Analytics
    tags:
      - Analytics
      - Metrics

  - term: Lines Saved
    definition: >-
      An estimated count of lines of code that developers saved by accepting
      AI completions from Windsurf, compared to typing the same code manually.
      Reported in user-level analytics.
    category: Analytics
    tags:
      - Analytics
      - Metrics
      - Productivity

  - term: MCP Configuration
    definition: >-
      Windsurf supports the Model Context Protocol (MCP) through a configuration
      file at ~/.codeium/windsurf/mcp_config.json, enabling integration with
      external tools and APIs that expose MCP-compatible servers.
    category: Integration
    tags:
      - MCP
      - Integration
      - Configuration

  - term: Context Window
    definition: >-
      The amount of code, documentation, and context that the Cascade AI can
      process at once. Windsurf's PCW (Project Context Window) data source tracks
      usage of context window capacity.
    category: AI
    tags:
      - AI
      - Context
      - Performance
