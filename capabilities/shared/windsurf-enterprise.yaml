naftiko: "1.0.0-alpha1"

info:
  label: "Windsurf Enterprise API"
  description: >-
    Shared consumer definition for the Windsurf Enterprise API. Provides analytics
    for code completions, Cascade AI usage, user-level metrics, billing configuration,
    and team credit balance management.
  tags:
    - Windsurf
    - Analytics
    - Enterprise
    - Billing
    - AI Coding
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      WINDSURF_SERVICE_KEY: WINDSURF_SERVICE_KEY

capability:
  consumes:
    - type: http
      namespace: windsurf
      baseUri: https://server.codeium.com/api/v1
      description: "Windsurf Enterprise API for analytics and billing management"
      authentication:
        type: apikey
        key: service_key
        value: "{{WINDSURF_SERVICE_KEY}}"
        placement: body
      resources:
        - name: analytics
          path: /Analytics
          description: "Custom analytics for code completions and AI usage"
          operations:
            - name: get-custom-analytics
              method: POST
              description: "Get Custom Analytics"
              body:
                type: json
                data:
                  service_key: "{{WINDSURF_SERVICE_KEY}}"
                  group_name: "{{tools.group_name}}"
                  start_timestamp: "{{tools.start_timestamp}}"
                  end_timestamp: "{{tools.end_timestamp}}"
                  query_requests: "{{tools.query_requests}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: user-analytics
          path: /UserPageAnalytics
          description: "Per-user analytics data"
          operations:
            - name: get-user-analytics
              method: POST
              description: "Get User Page Analytics"
              body:
                type: json
                data:
                  service_key: "{{WINDSURF_SERVICE_KEY}}"
                  emails: "{{tools.emails}}"
                  start_timestamp: "{{tools.start_timestamp}}"
                  end_timestamp: "{{tools.end_timestamp}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: cascade-analytics
          path: /CascadeAnalytics
          description: "Cascade AI agent usage analytics"
          operations:
            - name: get-cascade-analytics
              method: POST
              description: "Get Cascade Analytics"
              body:
                type: json
                data:
                  service_key: "{{WINDSURF_SERVICE_KEY}}"
                  emails: "{{tools.emails}}"
                  start_timestamp: "{{tools.start_timestamp}}"
                  end_timestamp: "{{tools.end_timestamp}}"
                  query_requests: "{{tools.query_requests}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: billing
          path: /GetTeamCreditBalance
          description: "Billing and credit management"
          operations:
            - name: get-credit-balance
              method: POST
              description: "Get Team Credit Balance"
              body:
                type: json
                data:
                  service_key: "{{WINDSURF_SERVICE_KEY}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-usage-config
              method: POST
              description: "Get Usage Configuration"
              body:
                type: json
                data:
                  service_key: "{{WINDSURF_SERVICE_KEY}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: set-usage-config
              method: POST
              description: "Set Usage Configuration"
              body:
                type: json
                data:
                  service_key: "{{WINDSURF_SERVICE_KEY}}"
                  model_access: "{{tools.model_access}}"
                  feature_flags: "{{tools.feature_flags}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: windsurf-shared-api
      resources:
        - path: /v1/analytics
          name: analytics
          operations:
            - method: POST
              name: get-analytics
              description: "Query analytics"
              call: "windsurf.get-custom-analytics"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: windsurf-shared-mcp
      transport: http
      tools:
        - name: get-analytics
          description: "Query Windsurf code completion analytics"
          hints:
            readOnly: true
            openWorld: true
          call: "windsurf.get-custom-analytics"
          outputParameters:
            - type: object
              mapping: "$."
